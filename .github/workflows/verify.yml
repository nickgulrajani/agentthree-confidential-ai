name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily health check at 14:00 UTC. Runs tests; does not create commits.
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q
